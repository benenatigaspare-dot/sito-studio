<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITOLO_SEO}} | Studio Legale Benenati</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F1E6;
    --ink: #101A3D;
    --ink-soft: #3A4262;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Poppins', system-ui, sans-serif;
    line-height: 1.6;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 24px 100px;
  }
  header.site {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px;
    border-bottom: 2px solid var(--ink);
  }
  header.site img { height: 48px; }
  header.site a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  .eyebrow {
    text-transform: uppercase;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--ink);
  }
  .eyebrow-line {
    width: 50px;
    height: 3px;
    background: var(--ink);
    margin: 10px 0 24px;
  }
  h1 {
    font-weight: 800;
    font-size: 40px;
    line-height: 1.15;
    letter-spacing: -0.5px;
    margin: 0 0 12px;
  }
  .source-line {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 40px;
  }
  article h2 {
    font-weight: 800;
    font-size: 24px;
    margin-top: 40px;
    margin-bottom: 12px;
  }
  article p {
    font-size: 17px;
    color: var(--ink);
    margin: 0 0 18px;
  }
  .cta-box {
    margin-top: 48px;
    padding: 28px;
    border: 2px solid var(--ink);
    text-align: center;
  }
  .cta-box p {
    margin: 0 0 16px;
    font-weight: 600;
  }
  .cta-box a {
    display: inline-block;
    background: var(--ink);
    color: var(--bg);
    text-decoration: none;
    font-weight: 800;
    padding: 12px 28px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 14px;
  }
  footer.site {
    text-align: center;
    padding: 32px 24px;
    font-size: 13px;
    color: var(--ink-soft);
    border-top: 2px solid var(--ink);
  }
</style>
</head>
<body>

<header class="site">
  <img src="/assets/logo-benenati.png" alt="Studio Legale Benenati">
  <a href="/#contatti">Contattaci</a>
</header>

<div class="container">
  <div class="eyebrow">{{CATEGORIA}}</div>
  <div class="eyebrow-line"></div>

  <h1>{{TITOLO_ARTICOLO}}</h1>
  <div class="source-line">{{RIGA_FONTE_OPZIONALE}}</div>

  <article>
    {{CORPO_ARTICOLO_HTML}}
  </article>

  <div class="cta-box">
    <p>Hai un dubbio su questo argomento? Parliamone.</p>
    <a href="/#contatti">Contatta lo Studio</a>
  </div>
</div>

<footer class="site">
  Studio Legale Benenati — Via Manzoni 7, Alcamo — studiolegalebenenati@gmail.com
</footer>

</body>
</html>
